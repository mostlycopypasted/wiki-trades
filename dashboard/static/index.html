<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050709" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-title" content="Trade Terminal">
  <title>Trade Terminal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050709'/%3E%3Crect x='.5' y='.5' width='15' height='15' fill='none' stroke='%23ffa81f'/%3E%3Cpath d='M8 3.5l4.5 8.5h-9z' fill='%23ffa81f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▲</span> <span class="name">TRADE TERMINAL</span><button class="sidetoggle" id="sideToggle" type="button" title="Collapse sidebar ([)" aria-label="Collapse sidebar" aria-expanded="true">«</button></div>
    <nav class="nav" id="nav">
      <a href="#desk" data-view="desk" title="Desk"><i>1</i><span class="lb">Desk</span></a>
      <a href="#signals" data-view="signals" title="Signals"><i>2</i><span class="lb">Signals</span></a>
      <a href="#analysis" data-view="analysis" title="Analysis"><i>3</i><span class="lb">Analysis</span></a>
      <a href="#calendar" data-view="calendar" title="Calendar"><i>4</i><span class="lb">Calendar</span></a>
      <a href="#ahh" data-view="ahh" title="Sessions"><i>5</i><span class="lb">Sessions</span></a>
      <a href="#brief" data-view="brief" title="Brief"><i>6</i><span class="lb">Brief</span></a>
      <a href="#my-watchlist" data-view="my-watchlist" title="Watchlist"><i>7</i><span class="lb">Watchlist</span></a>
      <a href="#journal" data-view="journal" title="Journal"><i>8</i><span class="lb">Journal</span></a>
      <a href="#performance" data-view="performance" title="Perf"><i>9</i><span class="lb">Perf</span></a>
    </nav>
    <div class="search-wrap">
      <span class="ico">›</span>
      <input id="q" type="search" placeholder="symbol or cmd" autocomplete="off" list="symlist" aria-label="Search">
      <kbd>/</kbd>
      <datalist id="symlist"></datalist>
    </div>
    <div class="status">
      <span class="sessions" id="sessions" title="FX sessions open now"></span><span class="clock" id="clock"></span>
      <span class="dot" id="sheetDot"></span><span class="lbl" id="sheetLbl">Sheet…</span>
      <button class="iconbtn" id="refreshBtn" title="Re-pull alert sheet and reload wiki data">↻</button>
      <button class="iconbtn" id="themeBtn" title="Toggle light/dark">◐</button>
    </div>
  </header>
  <div class="tape" id="tape" aria-label="Latest signals"></div>

  <main id="main">
    <section id="view-desk" class="view"></section>
    <section id="view-signals" class="view hidden"></section>
    <section id="view-analysis" class="view hidden"></section>
    <section id="view-calendar" class="view hidden"></section>
    <section id="view-ahh" class="view hidden"></section>
    <section id="view-brief" class="view hidden"></section>
    <section id="view-my-watchlist" class="view hidden"></section>
    <section id="view-journal" class="view hidden"></section>
    <section id="view-performance" class="view hidden"></section>
  </main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Instrument detail">
    <div class="dh"><h2 id="dSym"></h2><span id="dTags" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"></span><span style="margin-left:auto"></span><button class="iconbtn" id="dClose">✕</button></div>
    <div class="dbody" id="dBody"></div>
  </aside>
  <div class="modal" id="modal" role="dialog">
    <div class="mh"><span class="ttl" id="mTitle"></span><span style="margin-left:auto"></span><button class="iconbtn" id="mClose">✕</button></div>
    <div class="mb"><div class="md" id="mBody"></div></div>
  </div>
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Chart viewer"><button class="lbclose" data-lbclose aria-label="Close">✕</button><button class="lbnav prev" data-lb="-1" aria-label="Previous image">‹</button><button class="lbnav next" data-lb="1" aria-label="Next image">›</button><div class="lbtrack" id="lbTrack"></div><div class="cap" id="lbCap"></div><div class="lbstrip" id="lbStrip" aria-label="Thumbnails"></div></div>
  <div class="tooltip" id="tooltip"></div>

  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
